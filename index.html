
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ليوان… صديقك في كل وقت</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', Arial, sans-serif;
      background-color: #f8ebd7;
      color: #4c6b82;
      min-height: 100vh;
      direction: rtl;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .liwan-container {
      background: #fff8f0;
      border-radius: 24px;
      box-shadow: 0px 4px 32px #eee2d1a0;
      padding: 48px 24px 40px 24px;
      max-width: 460px;
      width: 95vw;
      text-align: center;
    }

    .liwan-headline {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 24px;
      color: #4c6b82;
      letter-spacing: 1px;
      line-height: 1.3;
    }

    .liwan-subheadline {
      font-size: 1.35rem;
      margin-bottom: 10px;
      color: #5c5766;
    }
    .liwan-subheadline:last-child {
      margin-bottom: 36px;
      color: #6D6350;
      font-size: 1.15rem;
    }

    .liwan-buttons {
      display: flex;
      flex-direction: column;
      gap: 22px;
      width: 100%;
      margin-top: 10px;
    }
    .liwan-btn {
      font-size: 1.3rem;
      font-weight: 600;
      padding: 18px 0;
      border-radius: 12px;
      border: none;
      outline: none;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
      cursor: pointer;
      box-shadow: 0px 2px 10px #e6dac4a8;
      background: #4c6b82;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .liwan-btn:focus,
    .liwan-btn:hover {
      background: #365069;
      color: #ffedc0;
      box-shadow: 0px 4px 12px #ccc7b2d8;
    }
    .liwan-btn.continue {
      background: #f8ebd7;
      color: #4c6b82;
      border: 2px solid #4c6b82;
    }
    .liwan-btn.continue:focus,
    .liwan-btn.continue:hover {
      background: #f3dfc3;
      border-color: #365069;
      color: #365069;
    }
    @media (max-width: 600px) {
      .liwan-container {
        padding: 24px 7vw 28px 7vw;
        border-radius: 0;
        box-shadow: none;
      }
      .liwan-headline {
        font-size: 1.7rem;
      }
      .liwan-btn {
        font-size: 1.07rem;
        padding: 13px 0;
        border-radius: 9px;
      }
    }
  </style>
  <script>
    function isUserLoggedIn() {
      return localStorage.getItem("isLoggedIn") === "true";
    }
  </script>
</head>
<body>
  <div class="liwan-container" tabindex="0">
    <div class="liwan-headline" aria-label="ليوان… صديقك في كل وقت">
      ليوان… صديقك في كل وقت
    </div>
    <div class="liwan-subheadline">
      انضم لعائلتنا الكبيرة وابدأ رحلتك معنا
    </div>
    <div class="liwan-subheadline">
      تطبيقك للبقاء على تواصل دائم، والمشاركة في الأنشطة، والشعور بالأمان
    </div>
    <div class="liwan-buttons">
      <button class="liwan-btn start" onclick="goToRegistration()"> ابدأ رحلتك مع ليوان</button>
      <button class="liwan-btn continue" onclick="goToAccount()">أكمل طريقك من آخر محطة وصلتها معنا</button>
    </div>
  </div>
  <script>
    // Replace these with actual navigation/routes when available
    function goToRegistration() {
      window.location.href = "newuser..html";
      alert("سيتم تحويلك لصفحة التسجيل للمستخدمين الجدد.");
    }
    function goToAccount() {
      window.location.href = "home.html";
      alert("سيتم تحويلك لحسابك الشخصي أو متابعة الاستخدام.");
    }
    // Keyboard accessibility (Enter/Space on buttons)
    document.querySelectorAll('.liwan-btn').forEach(function(btn){
      btn.addEventListener('keydown', function(e){
        if(e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          btn.click();
        }
      });
    });
  </script>
</body>
</html>
